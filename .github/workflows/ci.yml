name: Application checks

on: [push, pull_request]

jobs: test: runs-on: ubuntu-latest services: mongodb: image: mongo:8 ports: ["27017:27017"] options: >- --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'" --health-interval 10s --health-timeout 5s --health-start-period 20s --health-retries 10

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: "24"
      cache: npm

  - run: npm ci

  - run: npm test
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/sfl_ci_test

  - run: npm run build

  - run: npm audit --omit=dev